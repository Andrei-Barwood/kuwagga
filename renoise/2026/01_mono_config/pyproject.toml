[project]
name = "lurssen-mono-breakcore"
version = "1.0.0"
description = "Batch mono mastering for breakcore discographies using Lurssen Mastering Console AU (pedalboard) or ffmpeg emulation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pedalboard>=0.8.0",
    "numpy>=1.21",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "questionary>=2.0.0",
]

[project.scripts]
lurssen-mono-breakcore = "lurssen_mono_breakcore:main"

[tool.setuptools]
py-modules = ["lurssen_mono_breakcore"]

[tool.black]
line-length = 100
