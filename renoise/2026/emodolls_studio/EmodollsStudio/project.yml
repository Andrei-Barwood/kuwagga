name: EmodollsStudio
options:
  bundleIdPrefix: studio.emodolls
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: T77VRM22PQ
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
targets:
  EmodollsStudio:
    type: application
    platform: macOS
    sources:
      - path: EmodollsStudio
        excludes:
          - "**/.DS_Store"
          - "Vendor/**"
      - path: EmodollsStudio/Vendor/libmp3lame.0.dylib
        buildPhase: resources
        type: file
      - path: EmodollsStudio/Vendor/libmpg123.0.dylib
        buildPhase: resources
        type: file
      - path: EmodollsStudio/Vendor/NOTICE.txt
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_NAME: emodolls studio
        PRODUCT_MODULE_NAME: EmodollsStudio
        PRODUCT_BUNDLE_IDENTIFIER: studio.emodolls.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: emodolls studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 emodolls. MIT.
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        CODE_SIGN_ENTITLEMENTS: EmodollsStudio/App/EmodollsStudio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        SUPPORTED_PLATFORMS: macosx
        SDKROOT: macosx
        TARGETED_DEVICE_FAMILY: ""
        ENABLE_TESTABILITY: YES
      configs:
        Release:
          ENABLE_TESTABILITY: NO
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  EmodollsStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EmodollsStudioTests
    dependencies:
      - target: EmodollsStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.emodolls.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/emodolls studio.app/Contents/MacOS/emodolls studio"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T77VRM22PQ
        CODE_SIGN_IDENTITY: "Apple Development"
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=macosx*]: x86_64
        SUPPORTED_PLATFORMS: macosx
        SDKROOT: macosx
schemes:
  EmodollsStudio:
    build:
      targets:
        EmodollsStudio: all
        EmodollsStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EmodollsStudioTests
    profile:
      config: Release
    archive:
      config: Release
